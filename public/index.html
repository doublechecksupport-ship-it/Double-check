<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoubleCheck - AI Legal Document Summariser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .logo-icon {
            height: 36px;
            width: 36px;
            min-width: 36px;
            display: inline-block;
        }

        /* Subtle Loading Pulse and Spinner Animations */
        @keyframes subtlePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .animate-subtle-pulse {
            animation: subtlePulse 2s infinite ease-in-out;
        }

        @keyframes spinSmooth {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spinner {
            border: 3px solid rgba(30, 58, 138, 0.15);
            border-top: 3px solid #1e3a8a;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spinSmooth 0.8s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans selection:bg-blue-100">

    <!-- HEADER -->
    <header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20 shadow-xs">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('homeView')">
            <svg class="logo-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <path d="M416 160H352C334.327 160 320 145.673 320 128V64H96C78.3269 64 64 78.3269 64 96V416C64 433.673 78.3269 448 96 448H416C433.673 448 448 433.673 448 416V160H416Z" fill="#1e3a8a"/>
                <path d="M320 64L448 192V160H352C334.327 160 320 145.673 320 128V64Z" fill="white" fill-opacity="0.85"/>
                <rect x="120" y="220" width="180" height="24" rx="12" fill="white"/>
                <rect x="120" y="272" width="220" height="24" rx="12" fill="white"/>
                <rect x="120" y="324" width="220" height="24" rx="12" fill="white"/>
                <rect x="120" y="376" width="140" height="24" rx="12" fill="white"/>
            </svg>
            <span class="text-2xl font-extrabold tracking-tight text-slate-900">DoubleCheck</span>
        </div>
        <div class="flex items-center space-x-3">
            <span id="userStatusDisplay" onclick="switchView('accountView')" class="text-xs font-semibold text-blue-900 hover:underline cursor-pointer hidden sm:inline">Not logged in</span>
            <button onclick="toggleMenu()" class="p-2 rounded-xl border border-slate-200 hover:bg-slate-100 transition text-slate-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- SLIDE-OUT DRAWER -->
    <div id="menuDrawer" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex justify-end">
        <div class="w-80 bg-white h-full shadow-2xl p-6 flex flex-col justify-between border-l border-slate-200">
            <div>
                <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                    <span class="text-lg font-bold text-slate-900">Menu</span>
                    <button onclick="toggleMenu()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 font-bold">✕</button>
                </div>
                <nav id="drawerNavLinks" class="space-y-2"></nav>
            </div>
            <div id="drawerAuthSection" class="pt-4 border-t border-slate-100"></div>
        </div>
    </div>

    <!-- MAIN HOMEPAGE VIEW -->
    <main id="homeView" class="view-section hidden flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col justify-center items-center text-center">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 mb-3">Summarise Any Legal Document</h1>
        <p class="text-slate-500 mb-8 max-w-lg">Upload an image, upload a PDF file, or paste your legal text below for a clear breakdown.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full mb-6">
            <label class="bg-white border border-slate-200 rounded-3xl p-6 shadow-xs hover:border-blue-900 hover:shadow-md transition cursor-pointer flex flex-col items-center justify-center">
                <span class="text-blue-900 font-bold mb-1
