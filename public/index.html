<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Check - AI Legal Document Summariser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
      }
      body {
        font-family: var(--font-main);
        overflow-x: hidden;
        background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 60%, #e2e8f0 100%);
        background-attachment: fixed;
        min-height: 100vh;
        padding-top: 90px;
      }
      .liquid-glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.04), inset 0 1px 0 rgba(255, 255, 255, 1);
      }
      .btn-primary {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #ffffff;
        font-weight: 600;
        border-radius: 980px;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(15, 23, 42, 0.25);
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.8);
        color: #0f172a;
        font-weight: 500;
        border: 1px solid rgba(203, 213, 225, 0.8);
        border-radius: 980px;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-secondary:hover {
        background: #ffffff;
        border-color: #94a3b8;
        transform: translateY(-2px);
      }
      #top-navbar {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
        z-index: 40;
      }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased relative">

    <!-- AUTH MODAL -->
    <div id="auth-gate-modal" style="display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(12px); padding: 16px;">
        <div class="liquid-glass w-full max-w-md p-8 rounded-3xl text-left relative">
            <div class="flex items-center justify-between mb-6">
                <span class="text-lg font-bold text-slate-900 tracking-tight">Double Check Account</span>
                <button type="button" onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer text-sm font-semibold">✕</button>
            </div>
            <form onsubmit="handleDummySubmit(event)" class="space-y-4">
                <div>
                    <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Email Address</label>
                    <input type="email" required placeholder="name@example.com" class="w-full mt-1.5 p-3.5 bg-white/80 border border-slate-200 rounded-xl text-sm text-slate-900 focus:outline-none">
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full mt-1.5 p-3.5 bg-white/80 border border-slate-200 rounded-xl text-sm text-slate-900 focus:outline-none">
                </div>
                <button type="submit" class="btn-primary w-full py-3.5 text-xs font-bold cursor-pointer mt-2">Continue</button>
                <button type="button" onclick="closeAuthModal()" class="w-full text-center text-xs text-slate-500 hover:text-slate-800 pt-1 cursor-pointer font-medium">Cancel</button>
            </form>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav id="top-navbar" class="fixed top-4 left-1/2 -translate-x-1/2 w-[92%] max-w-5xl py-3.5 px-6 rounded-2xl flex items-center justify-between">
        <span class="font-bold text-base text-slate-900 tracking-tight">Double Check</span>
        <button type="button" onclick="openAuthModal()" class="btn-secondary px-5 py-2 text-xs font-semibold cursor-pointer">Sign In</button>
    </nav>

    <!-- HERO -->
    <main class="flex-1 flex flex-col px-6 py-24 max-w-5xl mx-auto w-full items-center text-center space-y-8">
        <h1 class="text-4xl sm:text-6xl font-bold tracking-tight text-slate-900 leading-[1.1]">Understand Any Legal Contract in Seconds.</h1>
        <p class="text-sm sm:text-base text-slate-600 max-w-2xl mx-auto">Transform complex legal agreements into crystal-clear plain-English summaries instantly.</p>
        <button type="button" onclick="openAuthModal()" class="btn-primary px-8 py-4 text-xs font-bold shadow-xl cursor-pointer">Get Started Free</button>
    </main>

    <script>
        function openAuthModal() {
            const modal = document.getElementById('auth-gate-modal');
            if (modal) modal.style.display = 'flex';
        }
        function closeAuthModal() {
            const modal = document.getElementById('auth-gate-modal');
            if (modal) modal.style.display = 'none';
        }
        function handleDummySubmit(event) {
            event.preventDefault();
            alert("Button click and form submission working perfectly!");
            closeAuthModal();
        }
    </script>
</body>
</html>
