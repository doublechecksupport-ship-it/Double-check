<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Check - AI Legal Contract Summariser</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="w-full bg-slate-900 text-white px-6 py-4 flex items-center justify-between border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-lg shadow-md">
                DC
            </div>
            <span class="text-xl font-bold tracking-wide">Double Check</span>
        </div>

        <button onclick="toggleMenu()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition flex items-center space-x-2 text-sm font-medium">
            <span>Menu</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </header>

    <!-- SLIDE-OUT MENU DRAWER -->
    <div id="menuDrawer" class="fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-sm hidden">
        <div class="w-80 h-full bg-slate-900 border-l border-slate-800 p-6 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-lg font-bold">Account Menu</h2>
                    <button onclick="toggleMenu()" class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-white">✕</button>
                </div>

                <div class="space-y-6">
                    <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
                        <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Subscription Status</p>
                        <p class="text-base font-bold text-indigo-400 mt-1">Free Tier</p>
                        
                        <div class="mt-4 pt-4 border-t border-slate-700/50">
                            <div class="flex justify-between text-xs text-slate-300 mb-1">
                                <span>Contracts Left This Month</span>
                                <span class="font-bold text-white">3 / 5</span>
                            </div>
                            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div class="bg-indigo-500 h-full w-3/5"></div>
                            </div>
                        </div>
                    </div>

                    <nav class="space-y-2">
                        <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">About Double Check</a>
                        <a href="#" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">Account Settings</a>
                    </nav>
                </div>
            </div>

            <button class="w-full py-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold border border-red-500/20 transition">
                Sign Out
            </button>
        </div>
    </div>

    <!-- MAIN HOMEPAGE DASHBOARD -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col justify-center space-y-6">
        <div class="text-center space-y-2 mb-4">
            <h1 class="text-3xl font-extrabold tracking-tight">Simplify Any Legal Contract</h1>
            <p class="text-slate-400 text-sm">Upload a photo, a PDF, or paste text below to get your instant 8-box AI breakdown.</p>
        </div>

        <!-- TOP UPLOAD ROW -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="border-2 border-dashed border-slate-700 hover:border-indigo-500 bg-slate-900/50 hover:bg-slate-900 transition rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer text-center group">
                <div class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                    📷
                </div>
                <span class="font-semibold text-slate-200">Upload Photo</span>
                <span class="text-xs text-slate-400 mt-1">Snap or select an image (JPG, PNG)</span>
                <input type="file" accept="image/*" class="hidden">
            </label>

            <label class="border-2 border-dashed border-slate-700 hover:border-indigo-500 bg-slate-900/50 hover:bg-slate-900 transition rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer text-center group">
                <div class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                    📄
                </div>
                <span class="font-semibold text-slate-200">Upload PDF File</span>
                <span class="text-xs text-slate-400 mt-1">Select document from your files</span>
                <input type="file" accept=".pdf" class="hidden">
            </label>
        </div>

        <!-- BIG PASTE BOX -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Or Paste Contract Text</label>
            <textarea 
                rows="6" 
                class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition text-sm"
                placeholder="Paste the full terms, agreement, or legal text here..."
            ></textarea>
        </div>

        <!-- SUMMARISE BUTTON -->
        <button class="w-full py-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-base shadow-lg shadow-indigo-600/20 transition transform active:scale-[0.99]">
            Summarise Contract ⚡
        </button>
    </main>

    <!-- SIMPLE MENU SCRIPT -->
    <script>
        function toggleMenu() {
            const drawer = document.getElementById('menuDrawer');
            drawer.classList.toggle('hidden');
        }
    </script>
</body>
</html>
