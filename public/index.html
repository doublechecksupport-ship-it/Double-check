<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Check - AI Legal Document Summariser</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background-color: #0b0f19;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      .glass {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .apple-btn {
        background-color: #ffffff;
        color: #0b0f19;
        font-weight: 600;
        border-radius: 9999px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .apple-btn:hover {
        background-color: #e2e8f0;
      }
    </style>
</head>
<body class="antialiased">

    <!-- AUTH MODAL -->
    <div id="auth-modal" style="display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); padding: 16px;">
        <div class="glass w-full max-w-md p-8 rounded-3xl text-left relative">
            <h2 id="modal-title" style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">Sign In</h2>
            
            <form id="auth-form" onsubmit="handleAuth(event)" style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label style="font-size: 12px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 6px;">Email</label>
                    <input type="email" id="auth-email" required placeholder="you@example.com" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 14px;">
                </div>
                <div>
                    <label style="font-size: 12px; color: #94a3b8; text-transform: uppercase; display: block; margin-bottom: 6px;">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-size: 14px;">
                </div>
                <button type="submit" class="apple-btn" style="width: 100%; padding: 14px; font-size: 14px; border: none;">Continue</button>
                <button type="button" onclick="closeModal()" style="background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; text-align: center;">Cancel</button>
            </form>
        </div>
    </div>

    <!-- NAVBAR -->
    <nav style="position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1000px; padding: 12px 24px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center;" class="glass">
        <span style="font-weight: bold; font-size: 16px;">Double Check</span>
        <button type="button" onclick="openModal()" class="apple-btn" style="padding: 8px 16px; font-size: 12px; border: none;">Sign In</button>
    </nav>

    <!-- HERO SECTION -->
    <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 20px 60px; max-width: 800px; margin: 0 auto;">
        <h1 style="font-size: 48px; font-weight: bold; line-height: 1.1; margin-bottom: 24px;">Understand Any Legal Contract in Seconds.</h1>
        <p style="color: #94a3b8; font-size: 16px; margin-bottom: 32px; line-height: 1.5;">Transform complex legal agreements into plain-English summaries instantly.</p>
        <button type="button" onclick="openModal()" class="apple-btn" style="padding: 16px 32px; font-size: 14px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">Get Started Free</button>
    </main>

    <script>
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(
                    "https://jxdnesvlwvmdbfwjzfga.supabase.co", 
                    "sb_publishable_t31ivgTLgaQK2T6WhXKB3Q_WvMZW0zr"
                );
            }
        } catch (e) {
            console.error("Supabase init error:", e);
        }

        function openModal() {
            const modal = document.getElementById('auth-modal');
            if (modal) modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('auth-modal');
            if (modal) modal.style.display = 'none';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            if (!supabaseClient) {
                alert("Supabase client not initialized.");
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert(error.message);
                return;
            }
            if (data && data.user) {
                closeModal();
                alert("Successfully signed in!");
            }
        }
    </script>
</body>
</html>
